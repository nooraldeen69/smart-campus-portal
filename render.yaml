# Render "Blueprint": one click deploy of the portal (free plan).
# Dashboard -> New -> Blueprint -> pick your GitHub repo.
services:
  - type: web
    name: smart-campus-portal
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Smart Campus Portal
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DEMO_MODE            # shows the demo student accounts on the login page
        value: "true"
      - key: ADMIN_PASSWORD       # password of the admin account ADMIN001 (random - read it in the Render dashboard)
        generateValue: true
